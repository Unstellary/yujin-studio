<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111113">
<meta name="mobile-web-app-capable" content="yes">
<title>Yujin Studio</title>
<style>
:root{--accent:#7c3aed;--accent2:#a78bfa;--bg:#111113;--panel:#1c1c1f;--panel2:#26262b;--line:#2e2e33;--text:#f2f2f4;--muted:#a1a1a8;--stage:#2b2b2e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:disabled{opacity:.4}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--text)}
.ib.on{background:var(--accent)}
.ib.soft.on{background:#3a3a40}
.tb{min-height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#e5e5ea}
.tb:active,.ib:active{background:#2e2e34}
.btn{min-height:40px;padding:0 14px;border-radius:10px;background:#2e2e34;font-size:14px}
.btn.pri{background:var(--accent);color:#fff;font-weight:600}
.btn.danger{background:#5b1e24;color:#ffd7db}
/* Galerie */
#gallery{position:fixed;inset:0;display:flex;flex-direction:column}
#gallery header{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #26262a}
.logo{display:flex;align-items:center;gap:10px;color:#c4b5fd;font-weight:600;font-size:16px}
#gallery main{flex:1;overflow:auto;padding:20px 24px 40px}
#gallery h1{margin:0 0 18px;font-size:28px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px 22px}
.card{display:flex;flex-direction:column;gap:8px;align-items:center}
.thumb{width:100%;aspect-ratio:4/3;border-radius:6px;background:#26262b;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.55);position:relative}
.thumb img{max-width:100%;max-height:100%;display:block}
.card .meta{display:flex;align-items:center;gap:4px;max-width:100%}
.card .name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .size{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;margin-top:80px;line-height:1.6}
/* Feuilles / menus */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:300px;max-width:92vw;max-height:86vh;overflow:auto;box-shadow:0 14px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px}
.sheet h2{margin:0 0 6px;font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:0 6px;border-bottom:1px solid #26262b;font-size:14px}
.row:last-child{border-bottom:none}
.rowbtn{width:100%;text-align:left;min-height:46px;padding:0 6px;border-bottom:1px solid #26262b;font-size:14px}
.rowbtn:active{background:#26262b}
.rowbtn small{color:var(--muted);margin-left:6px}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:#3a3a40;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:23px}
input[type=range]{accent-color:var(--accent)}
.seg{display:flex;gap:2px;background:#151517;border-radius:10px;padding:2px}
.seg button{flex:1;min-height:38px;border-radius:8px;font-size:12.5px;color:var(--muted);padding:0 8px;white-space:nowrap}
.seg button.on{background:#2e2e34;color:#fff}
.seg.acc button.on{background:var(--accent)}
/* Éditeur */
#editor{position:fixed;inset:0;background:var(--stage)}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 6px 30px rgba(0,0,0,.5)}
#stage canvas,#stage .paper,#stage svg{position:absolute;left:0;top:0;width:100%;height:100%}
#stage .paper{background:#fff}
#stage svg{pointer-events:none;overflow:visible}
.cursor{position:absolute;pointer-events:none;border:1px solid rgba(255,255,255,.9);outline:1px solid rgba(0,0,0,.5);border-radius:50%;display:none}
.loupe{position:absolute;width:90px;height:90px;border-radius:50%;pointer-events:none;border:10px solid #000;box-shadow:0 0 0 2px #fff,0 4px 16px rgba(0,0,0,.5);display:none;transform:translate(-50%,-120%)}
#topbar{position:absolute;top:0;left:0;right:0;height:52px;padding:0 8px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;z-index:10}
#topbar nav{display:flex;align-items:center;gap:2px}
#colorBtn span{width:28px;height:28px;border-radius:14px;border:2px solid var(--text);display:block}
#sidebar{position:absolute;left:8px;top:120px;width:52px;padding:12px 0;background:var(--panel);border-radius:26px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:10}
body.right #sidebar{left:auto;right:8px}
.vslider{position:relative;width:36px;height:150px;touch-action:none}
.vslider .track{position:absolute;left:15px;top:0;bottom:0;width:6px;border-radius:3px;background:#3a3a40}
.vslider .fill{position:absolute;left:15px;bottom:0;width:6px;border-radius:3px;background:#d4d4da}
.vslider .knob{position:absolute;left:6px;width:24px;height:24px;margin-bottom:-12px;border-radius:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.vslider .tip{position:absolute;left:46px;background:var(--panel);border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap;display:none;margin-bottom:-12px}
body.right .vslider .tip{left:auto;right:46px}
#sidebar{gap:6px;top:96px}
.marks{position:absolute;left:9px;right:9px;top:0;bottom:0;pointer-events:none}
.mark{position:absolute;left:0;right:0;height:3px;margin-bottom:-1.5px;background:var(--accent2);border-radius:2px}
.pbtn{width:34px;height:26px;border-radius:9px;background:#2e2e34;color:#fff;font-size:17px;line-height:1}
#eyeBtn span{width:26px;height:26px;border-radius:6px;border:2px solid #d4d4da;display:block}
#eyeBtn.on span{border-color:var(--accent2);background:var(--accent2)}
body.hide-ui #topbar,body.hide-ui #sidebar,body.hide-ui .panel,body.hide-ui .bar{display:none!important}
.panel{position:absolute;top:58px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.6);z-index:20;display:flex;flex-direction:column;gap:8px;padding:12px;max-height:calc(100% - 70px);overflow:auto}
.panel{max-width:calc(100vw - 16px)}
.panel>*{flex-shrink:0}
.panel h2{margin:2px 4px;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.bar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(1000px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px;z-index:15;display:flex;flex-direction:column;gap:6px}
.bar h2{margin:0;font-size:15px}
.sl{display:flex;align-items:center;gap:14px;min-height:36px;font-size:13px}
.sl>span:first-child{width:120px;color:#c8c8ce;flex:none}
.sl input{flex:1}
.sl>span:last-child{width:52px;text-align:right;font-variant-numeric:tabular-nums}
.pill{position:absolute;top:62px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:18px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;z-index:16;pointer-events:none;white-space:nowrap}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:100;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.on{opacity:1}
/* Pinceaux */
.bl{display:flex;gap:10px}
.bl .cats{width:150px;display:flex;flex-direction:column;gap:2px;flex:none}
.catrow{display:flex;align-items:center;border-radius:10px;color:#d6d6dc}
.catrow.on{background:var(--accent);color:#fff}
.catname{flex:1;text-align:left;min-height:42px;padding:0 4px;font-size:14px;color:inherit}
.addcat{min-height:40px;color:var(--accent2);font-size:13px;text-align:left;padding:0 10px}
.handle{width:26px;min-height:40px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;touch-action:none;cursor:grab;flex:none}
.catrow.on .handle,.layer.on .handle{color:#fff}
.more{min-width:32px;min-height:36px;color:inherit;font-size:16px;border-radius:8px}
.bl .list{flex:1;display:flex;flex-direction:column;gap:6px;min-width:230px}
.bitem{display:flex;align-items:center;border:2px solid transparent;border-radius:10px;background:var(--panel2)}
.bitem.on{border-color:var(--accent)}
.bsel{flex:1;padding:6px 4px 6px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;font-size:13px;text-align:left;min-width:0}
.bside{display:flex;flex-direction:column;align-items:center}
.bitem canvas{width:220px;height:36px;max-width:100%}
.swatches .swc{touch-action:none}
/* Calques */
.layer{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:10px;background:var(--panel2);min-height:54px}
.layer.on{background:var(--accent)}
.layer .lt{width:56px;height:42px;border-radius:4px;flex:none;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%);background-size:12px 12px;background-position:0 0,6px 6px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.layer .lt canvas{max-width:100%;max-height:100%}
.layer .ln{flex:1;font-size:14px;text-align:left;min-height:44px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.layer .lm{font-size:13px;font-weight:600;width:30px;min-height:44px;color:var(--muted)}
.layer.on .lm{color:#fff}
.layer input{width:22px;height:22px;margin:0;accent-color:#fff}
.vis{width:30px;height:30px;flex:none;border-radius:7px;border:2px solid #8a8a92;color:#111;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.vis.on{background:#fff;border-color:#fff}
.layer.off,.grow.off{opacity:.42}
.layer.off .ln{text-decoration:line-through}
.layer.ing{margin-left:18px}
.cliparrow{color:var(--accent2);font-size:18px;margin-right:-4px}
.tag{display:block;font-size:10px;color:var(--accent2);font-weight:600}
.layer.on .tag{color:#fff}
.grow{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:10px;background:#202024;border:1px dashed #3a3a40;min-height:44px}
.grow .ln{font-weight:600}
.gtog{width:32px;min-height:40px;font-size:16px;color:var(--muted)}
/* Couleurs */
.cwheel{position:relative;width:260px;height:260px;margin:0 auto;touch-action:none}
.cwheel canvas{position:absolute;inset:0;width:100%;height:100%}
.cmark{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:11px;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:32px;height:32px;border-radius:16px;border:2px solid #3a3a40}
.cur{width:56px;height:26px;border-radius:6px;border:1px solid #3a3a40}
/* Animation */
body.anim-on .bar:not(#animBar){bottom:150px}
body.anim-on #refWin{bottom:160px}
#animBar{left:0;right:0;bottom:0;transform:none;width:auto;border-radius:0;border-width:1px 0 0}
.frames{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.frame{width:84px;height:62px;flex:none;border:3px solid transparent;border-radius:6px;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.frame.on{border-color:var(--accent)}
.frame canvas{max-width:100%;max-height:100%}
/* Référence */
#refWin{position:absolute;right:20px;bottom:60px;width:320px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.6);z-index:14;overflow:hidden}
#refWin header{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 4px 14px;touch-action:none;cursor:move;font-size:14px;font-weight:600}
#refBody{height:220px;background:#26262b;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#refBody canvas,#refBody img,#refBody video{max-width:100%;max-height:100%}
#refBody video{transform:scaleX(-1)}
</style>
</head>
<body>
<div id="gallery">
  <header>
    <div class="logo"><svg class="ic" viewBox="0 0 24 24" style="stroke:#c4b5fd"><path d="M18 3l3 3-9 9-3-3z"/><path d="M9 12c-3 0-5 2-5 5 0 1-1 2-2 2 2 2 7 2 8-1 1-2 0-4-1-6z"/></svg>Yujin Studio</div>
    <nav style="display:flex;align-items:center;gap:4px">
      <button class="tb" id="gSelect">Sélectionner</button>
      <button class="tb" id="gImport">Importer</button>
      <button class="tb" id="gPhoto">Photo</button>
      <button class="ib" id="gFull" aria-label="Plein écran"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="ib on" id="gNew" aria-label="Nouvelle toile" style="margin-left:6px"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </nav>
  </header>
  <main><h1>Galerie</h1><div id="grid"></div></main>
</div>

<div id="editor" class="hidden">
  <div id="viewport">
    <div id="stage"></div>
    <div class="cursor" id="cursor"></div>
    <div class="loupe" id="loupe"></div>
  </div>
  <div id="topbar">
    <nav>
      <button class="tb" id="bGallery">Galerie</button>
      <button class="ib soft" id="bActions" aria-label="Actions"><svg class="ic" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></button>
      <button class="ib soft" id="bAdjust" aria-label="Ajustements"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20L14 10M12 8l4 4M16 3v3M21 8h-3M19.5 4.5l-2 2M10 3.5l1 1.5"/></svg></button>
      <button class="ib soft" id="bSelect" aria-label="Sélection"><svg class="ic" viewBox="0 0 24 24"><path d="M7 7c5-4 13-2 12 3s-9 3-12 7c-1.3 1.8.3 3.8 3 3"/></svg></button>
      <button class="ib soft" id="bMove" aria-label="Transformer"><svg class="ic" viewBox="0 0 24 24"><path d="M5 3l14 7-6 2-2 6z"/></svg></button>
      <button class="ib" id="bFull" aria-label="Plein écran"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </nav>
    <nav>
      <button class="ib on" id="tBrush" aria-label="Pinceau"><svg class="ic" viewBox="0 0 24 24"><path d="M18 3l3 3-9 9-3-3z"/><path d="M9 12c-3 0-5 2-5 5 0 1-1 2-2 2 2 2 7 2 8-1 1-2 0-4-1-6z"/></svg></button>
      <button class="ib" id="tSmudge" aria-label="Estompe"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c3 5 6 8 6 11a6 6 0 0 1-12 0c0-3 3-6 6-11z"/></svg></button>
      <button class="ib" id="tEraser" aria-label="Gomme"><svg class="ic" viewBox="0 0 24 24"><path d="M8 20h12M4 15l9-9 6 6-8 8H9z"/><path d="M9 10l6 6"/></svg></button>
      <button class="ib soft" id="bLayers" aria-label="Calques"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
      <button class="ib" id="colorBtn" aria-label="Couleurs"><span></span></button>
    </nav>
  </div>
  <div id="sidebar">
    <div class="vslider" id="sizeSl" aria-label="Taille"><div class="track"></div><div class="fill"></div><div class="knob"></div><div class="tip"></div></div>
    <button class="pbtn" id="sizeSave" aria-label="Enregistrer cette taille">+</button>
    <button class="ib" id="eyeBtn" aria-label="Pipette"><span></span></button>
    <div class="vslider" id="opSl" aria-label="Opacité"><div class="track"></div><div class="fill"></div><div class="knob"></div><div class="tip"></div></div>
    <button class="pbtn" id="opSave" aria-label="Enregistrer cette opacité">+</button>
    <button class="ib" id="undoBtn" aria-label="Annuler"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5L4 10l5 5"/><path d="M4 10h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="ib" id="redoBtn" aria-label="Rétablir"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l5 5-5 5"/><path d="M20 10H10a6 6 0 0 0 0 12h3"/></svg></button>
  </div>
  <div id="panels"></div>
</div>
<div id="toast"></div>
