name: Appli native (Rust)

on:
  push:
    branches: [main]
    paths: ['natif.tgz', '.github/workflows/natif.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire
        run: mkdir natif && tar -xzf natif.tgz -C natif
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Rust pour Android
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: natif/rust
          key: android
      - name: Compiler la bibliothèque native
        working-directory: natif/rust
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK : $ANDROID_NDK_HOME"
          export YS_BUILD=${{ github.run_number }}
          cargo ndk -t arm64-v8a --platform 26 -o ../android/app/src/main/jniLibs build --release --lib
      - name: Compiler l'APK
        working-directory: natif/android
        env:
          YS_VC: ${{ github.run_number }}
          YS_VN: 0.1.${{ github.run_number }}
          YS_KS_PASS: ${{ secrets.YS_KS_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - run: cp natif/android/app/build/outputs/apk/release/app-release.apk Yujin-Studio-Natif.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Yujin-Studio-Natif.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire
        shell: bash
        run: mkdir natif && tar -xzf natif.tgz -C natif
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: natif/rust
          key: windows
      - name: Compiler l'exe
        working-directory: natif/rust
        env:
          YS_BUILD: ${{ github.run_number }}
        run: cargo build --release --bin yujin-studio
      - name: Préparer
        shell: pwsh
        run: |
          Copy-Item natif/rust/target/release/yujin-studio.exe "Yujin Studio Natif.exe"
          Compress-Archive -Path "Yujin Studio Natif.exe" -DestinationPath Yujin-Studio-Natif-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Yujin-Studio-Natif-Windows.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire
        run: mkdir natif && tar -xzf natif.tgz -C natif
      - name: Rust pour le navigateur
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: natif/rust
          key: web
      - name: Compiler en WebAssembly
        working-directory: natif/rust
        env:
          YS_BUILD: ${{ github.run_number }}
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"
        run: cargo build --release --lib --target wasm32-unknown-unknown
      - name: Préparer le site
        run: |
          wasm-bindgen --target web --no-typescript --out-dir site natif/rust/target/wasm32-unknown-unknown/release/yujin_studio.wasm
          cp natif/rust/web/* site/
          # dossier des petits scripts renommé à chaque version (sinon Safari garde l'ancien en cache)
          N=${{ github.run_number }}
          mv site/snippets "site/snippets-$N"
          sed -i -E "/^import /s#\./snippets/#./snippets-$N/#" site/yujin_studio.js
          grep -o "snippets-$N/[^']*" site/yujin_studio.js | head
          sed -i "s/__BUILD__/${{ github.run_number }}/g" site/index.html
          echo '{"build": ${{ github.run_number }}}' > site/version.json
          ls -la site
      - name: Mettre en ligne (GitHub Pages, dossier ipad/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            rm -rf ipad && mkdir ipad && cp -r site/. ipad/
            git add ipad
            git commit -m "Version web native ${{ github.run_number }}" || exit 0
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

  publier:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - name: Publier une préversion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          gh release create "natif-0.1.$N" Yujin-Studio-Natif.apk Yujin-Studio-Natif-Windows.zip \
            --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --title "Yujin Studio natif 0.1.$N (test)" \
            --notes "Version native en Rust (test)."
