name: APK Android

on:
  push:
    branches: [main]
    paths: ['android.tgz', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Préparer le projet
        run: |
          mkdir android && tar -xzf android.tgz -C android
          mkdir -p android/app/src/main/assets
          cp index.html version.json android/app/src/main/assets/

      - name: Compiler l'APK
        working-directory: android
        env:
          YS_VC: ${{ github.run_number }}
          YS_VN: 1.0.${{ github.run_number }}
          YS_KS_PASS: ${{ secrets.YS_KS_PASS }}
        run: |
          if [ -z "$YS_KS_PASS" ]; then
            echo "::warning::Secret YS_KS_PASS manquant : simple test de compilation, pas de publication"
            gradle assembleDebug --no-daemon --stacktrace
            echo "SKIP_RELEASE=1" >> "$GITHUB_ENV"
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Publier
        if: env.SKIP_RELEASE != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk Yujin-Studio.apk
          printf '{"versionCode":%s,"versionName":"1.0.%s","url":"https://github.com/%s/releases/latest/download/Yujin-Studio.apk"}\n' "$N" "$N" "$GITHUB_REPOSITORY" > apk.json
          gh release create "android-1.0.$N" Yujin-Studio.apk apk.json --title "Yujin Studio Android 1.0.$N" --notes "APK Android. Le contenu de l'appli se met ensuite à jour tout seul." --latest
