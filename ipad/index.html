<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Yujin Studio</title>
<meta name="theme-color" content="#18181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yujin Studio">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #111113;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
    touch-action: none; outline: none; -webkit-touch-callout: none; }
  #chargement { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #d4d4d8; font: 16px -apple-system, system-ui, sans-serif; gap: 14px; text-align: center; padding: 24px; }
  #chargement img { width: 96px; height: 96px; border-radius: 22px; }
  #chargement p { max-width: 520px; line-height: 1.4; }
  .barre { width: 180px; height: 4px; border-radius: 2px; background: #2a2a30; overflow: hidden; }
  .barre div { width: 40%; height: 100%; background: #8b5cf6; animation: aller 1.1s ease-in-out infinite alternate; }
  @keyframes aller { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
</style>
</head>
<body>
<div id="chargement"><img src="icon.png" alt=""><div>Yujin Studio</div><div class="barre"><div></div></div></div>
<script>
  // pas de zoom / défilement de la page : tout va à l'appli
  for (const ev of ['gesturestart', 'gesturechange', 'gestureend']) document.addEventListener(ev, e => e.preventDefault(), { passive: false });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());
  if (!document.createElement('canvas').getContext('webgl2')) {
    document.getElementById('chargement').innerHTML = '<p>Ce navigateur ne gère pas WebGL2. Mets à jour Safari (iPadOS 15 ou plus récent).</p>';
  }
</script>
<script type="module">
  import init from './yujin_studio.js?v=19';
  init({ module_or_path: './yujin_studio_bg.wasm?v=19' }).catch(e => {
    console.error(e);
    const el = document.getElementById('chargement');
    if (el) el.innerHTML = '<p>Oups : ' + String(e).replace(/</g, '&lt;') + '</p>';
  });
</script>
</body>
</html>
